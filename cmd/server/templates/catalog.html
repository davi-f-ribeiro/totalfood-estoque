<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Catálogo · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body>{{template "header" .}}{{template "nav" .}}<main class="main"><section class="panel catalog-manager"><div class="catalog-title"><div><h1>Catálogo</h1><p class="hint">Cadastros mestres de item pai e marca.</p></div><a class="button secondary" href="/products">Produto/Item</a></div><div class="catalog-manager-layout"><section><div class="section-heading"><h2>Itens pai</h2><button id="masterNewItem" type="button">+ Novo item</button></div><label class="catalog-search">Buscar item<input id="masterItemSearch" autocomplete="off" placeholder="Digite ao menos 2 caracteres"></label><div id="masterItemList" class="catalog-parent-list" aria-live="polite"></div><dialog id="masterItemDialog" class="editor-dialog" aria-labelledby="masterItemDialogTitle"><div class="editor-dialog-head"><h2 id="masterItemDialogTitle">Item pai</h2></div><form id="masterItemForm" hidden><input id="masterItemId" type="hidden"><div class="grid catalog-item-grid"><label>Nome<input id="masterItemName" autocomplete="off" required></label><label>Categoria<select id="masterCategory" required></select></label><label>Unidade<select id="masterUnit" required></select></label><label>Estoque mínimo<input id="masterMinimum" inputmode="decimal" value="0" required></label></div><label>Observação<textarea id="masterNotes" rows="2"></textarea></label><label class="check"><input id="masterItemActive" type="checkbox" checked> Item pai ativo</label><div class="actions"><button type="submit">Criar item pai</button><button id="masterCancelItem" class="secondary" type="button">Cancelar</button></div><div id="masterItemStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div></form></dialog></section><section><div class="section-heading"><h2>Marcas</h2><button id="masterNewBrand" type="button">+ Nova marca</button></div><label class="catalog-search">Buscar marca<input id="masterBrandSearch" autocomplete="off" placeholder="Digite ao menos 2 caracteres"></label><div id="masterBrandList" class="catalog-parent-list" aria-live="polite"></div><dialog id="masterBrandDialog" class="editor-dialog" aria-labelledby="masterBrandDialogTitle"><div class="editor-dialog-head"><h2 id="masterBrandDialogTitle">Marca</h2></div><form id="masterBrandForm" hidden><input id="masterBrandId" type="hidden"><label>Marca<input id="masterBrandName" autocomplete="off" required></label><label class="check"><input id="masterBrandActive" type="checkbox" checked> Marca ativa</label><div class="actions"><button type="submit">Criar marca</button><button id="masterCancelBrand" class="secondary" type="button">Cancelar</button></div><div id="masterBrandStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div></form></dialog></section></div><div id="masterStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div></section></main><script src="/static/app.js" defer></script><script src="/static/catalog_masters.js" defer></script></body></html>
