<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Catálogo · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><div class="brand"><span class="brand-slot" aria-label="Logotipo oficial Total Food pendente"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button><p id="accountStatus" class="msg" aria-live="polite"></p></div></details></header><nav class="nav"><a href="/stock">Estoque</a><a href="/entry">Entrada</a><a href="/exit">Saída</a><a href="/transfer">Transferir</a><a href="/catalog">Catálogo</a><a href="/assets">Patrimônio</a>{{if .CanAdmin}}<a href="/admin">Administração</a>{{end}}</nav><main class="main"><section class="panel catalog"><h1>Catálogo</h1><p class="hint">Cadastre item genérico e SKU sem alterar histórico.</p><div class="catalog-layout"><form id="catalogForm"><fieldset><legend>Item genérico</legend><input type="hidden" id="itemId"><label>Item<input id="itemName" autocomplete="off" required></label><div class="grid"><label>Categoria<select id="categoryId" required></select></label><label>Unidade<select id="unitCode" required></select></label></div><label>Estoque mínimo<input id="minimumStock" inputmode="decimal" value="0" required></label><label>Observação<textarea id="itemNotes" rows="2"></textarea></label><label class="check"><input id="itemActive" type="checkbox" checked> Ativo</label></fieldset><fieldset><legend>SKU / produto</legend><input type="hidden" id="skuId"><label>Produto/SKU<input id="skuName" autocomplete="off" required></label><label>Código de barras<input id="barcode" autocomplete="off" required></label><button id="scanBarcode" class="secondary" type="button" hidden>Ler código</button><section id="scanner" class="scanner" hidden><video id="scannerVideo" playsinline muted></video><p id="scanStatus" class="msg" aria-live="polite"></p><button id="scanCancel" class="secondary" type="button">Cancelar leitura</button></section><label class="check"><input id="skuActive" type="checkbox" checked> Ativo</label></fieldset><button type="submit">Salvar catálogo</button><p id="catalogStatus" class="msg" aria-live="polite"></p></form><section class="catalog-list"><label>Busca<input id="catalogSearch" autocomplete="off" placeholder="item, SKU ou barcode"></label><div id="catalogList" class="list" aria-live="polite"></div></section></div></section></main><script src="/static/app.js" defer></script></body></html>
