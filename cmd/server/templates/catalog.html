<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Catálogo · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><div class="brand"><span class="brand-slot"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button></div></details></header>{{template "nav" .}}<main class="main"><section class="panel"><div class="catalog-title"><div><h1>Catálogo</h1><p class="hint">Cadastros mestres de item pai e marca.</p></div></div><div class="grid"><section><div class="section-heading"><h2>Itens pai</h2><button id="masterNewItem" type="button">+ Novo item</button></div><input id="masterItemSearch" placeholder="Buscar item" autocomplete="off"><div id="masterItemList" class="catalog-parent-list"></div><form id="masterItemForm" hidden><input id="masterItemId" type="hidden"><label>Nome<input id="masterItemName" required></label><label>Categoria<select id="masterCategory" required></select></label><label>Unidade<select id="masterUnit" required></select></label><label>Estoque mínimo<input id="masterMinimum" inputmode="decimal" value="0" required></label><label>Observação<textarea id="masterNotes"></textarea></label><label class="check"><input id="masterItemActive" type="checkbox" checked> Ativo</label><div class="actions"><button type="submit">Salvar item</button><button id="masterCancelItem" class="secondary" type="button">Cancelar</button></div></form></section><section><div class="section-heading"><h2>Marcas</h2><button id="masterNewBrand" type="button">+ Nova marca</button></div><input id="masterBrandSearch" placeholder="Buscar marca" autocomplete="off"><div id="masterBrandList" class="catalog-parent-list"></div><form id="masterBrandForm" hidden><input id="masterBrandId" type="hidden"><label>Marca<input id="masterBrandName" required autocomplete="off"></label><label class="check"><input id="masterBrandActive" type="checkbox" checked> Ativa</label><div class="actions"><button type="submit">Salvar marca</button><button id="masterCancelBrand" class="secondary" type="button">Cancelar</button></div></form></section></div><p id="masterStatus" class="operation-feedback" role="status" aria-live="polite" hidden></p></section></main><script src="/static/app.js" defer></script><script src="/static/catalog_masters.js" defer></script></body></html>
