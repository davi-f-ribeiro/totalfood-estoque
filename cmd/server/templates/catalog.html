<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><meta name="current-user-id" content="{{.User.ID}}"><title>Catálogo · Gestão de Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body>{{template "header" .}}{{template "nav" .}}<main class="main"><section class="panel catalog-manager"><div class="catalog-title"><div><h1>Catálogo</h1><p class="hint">“Item” é o nome geral, como Leite. “Produto” é esse item numa marca e embalagem, com código de barras.</p></div><a class="button secondary catalog-products-link" href="/products">Produtos</a></div><div id="masterStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div><div class="catalog-tabs" role="tablist" aria-label="Cadastros do catálogo"><button id="masterTabItems" class="catalog-tab" type="button" role="tab" aria-selected="true" aria-controls="masterItemsPanel">Itens</button><button id="masterTabBrands" class="catalog-tab" type="button" role="tab" aria-selected="false" aria-controls="masterBrandsPanel" tabindex="-1">Marcas</button></div><div class="catalog-manager-layout"><section id="masterItemsPanel" class="catalog-panel" role="tabpanel" aria-labelledby="masterTabItems"><div class="section-heading"><h2>Itens</h2><button id="masterNewItem" type="button">+ Novo item</button></div><section id="masterItemPending" class="impact-warning catalog-pending" aria-live="polite" hidden><strong>Cadastro sem confirmação</strong><p id="masterItemPendingText"></p><div class="actions"><button id="masterItemRetry" type="button">Enviar de novo</button><button id="masterItemDiscard" class="secondary" type="button">Descartar</button></div></section><div id="masterItemFeedback" class="operation-feedback" role="status" aria-live="polite" hidden></div><label class="catalog-search">Buscar item<input id="masterItemSearch" type="search" autocomplete="off" enterkeyhint="search" placeholder="Digite ao menos 2 caracteres"></label><div id="masterItemList" class="catalog-parent-list" aria-live="polite"></div><dialog id="masterItemDialog" class="editor-dialog" aria-labelledby="masterItemDialogTitle"><div class="editor-dialog-head"><h2 id="masterItemDialogTitle">Novo item</h2></div><form id="masterItemForm" hidden><input id="masterItemId" type="hidden"><div class="grid catalog-item-grid"><label>Nome<input id="masterItemName" autocomplete="off" required></label><label>Categoria<select id="masterCategory" required></select></label><label>Unidade<select id="masterUnit" required></select></label><label>Estoque mínimo<input id="masterMinimum" inputmode="decimal" value="0" required></label></div><label>Observação<textarea id="masterNotes" rows="2"></textarea></label><label class="check"><input id="masterItemActive" type="checkbox" checked> Item ativo</label><div id="masterItemStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div><div class="actions"><button type="submit">Criar item</button><button id="masterCancelItem" class="secondary" type="button">Cancelar</button></div></form></dialog></section><section id="masterBrandsPanel" class="catalog-panel" role="tabpanel" aria-labelledby="masterTabBrands"><div class="section-heading"><h2>Marcas</h2><button id="masterNewBrand" type="button">+ Nova marca</button></div><section id="masterBrandPending" class="impact-warning catalog-pending" aria-live="polite" hidden><strong>Cadastro sem confirmação</strong><p id="masterBrandPendingText"></p><div class="actions"><button id="masterBrandRetry" type="button">Enviar de novo</button><button id="masterBrandDiscard" class="secondary" type="button">Descartar</button></div></section><div id="masterBrandFeedback" class="operation-feedback" role="status" aria-live="polite" hidden></div><label class="catalog-search">Buscar marca<input id="masterBrandSearch" type="search" autocomplete="off" enterkeyhint="search" placeholder="Digite ao menos 2 caracteres"></label><div id="masterBrandList" class="catalog-parent-list" aria-live="polite"></div><dialog id="masterBrandDialog" class="editor-dialog" aria-labelledby="masterBrandDialogTitle"><div class="editor-dialog-head"><h2 id="masterBrandDialogTitle">Nova marca</h2></div><form id="masterBrandForm" hidden><input id="masterBrandId" type="hidden"><label>Marca<input id="masterBrandName" autocomplete="off" required></label><label class="check"><input id="masterBrandActive" type="checkbox" checked> Marca ativa</label><div id="masterBrandStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div><div class="actions"><button type="submit">Criar marca</button><button id="masterCancelBrand" class="secondary" type="button">Cancelar</button></div></form></dialog></section></div></section></main><script src="/static/utils/offline-store.js" defer></script><script src="/static/app.js" defer></script><script src="/static/catalog_masters.js" defer></script></body></html>
