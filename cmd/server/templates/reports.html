<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Relatórios · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><div class="brand"><span class="brand-slot" aria-label="Logotipo oficial Total Food pendente"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button><p id="accountStatus" class="msg" aria-live="polite"></p></div></details></header><nav class="nav"><a href="/stock">Estoque</a><a href="/entry">Entrada</a><a href="/exit">Saída</a><a href="/transfer">Transferir</a><a href="/reports" aria-current="page">Relatórios</a><a href="/catalog">Catálogo</a><a href="/assets">Patrimônio</a>{{if .CanInventory}}<a href="/inventory">Auditoria de Estoque</a>{{end}}{{if .CanAdmin}}<a href="/admin">Administração</a>{{end}}</nav><main class="main"><section class="panel reports"><h1>Relatórios</h1><form id="reportForm"><fieldset class="report-shortcuts"><legend>Período</legend><button type="button" class="secondary" data-period="today">Hoje</button><button type="button" class="secondary" data-period="week">Esta semana</button><button type="button" class="secondary" data-period="month">Este mês</button></fieldset><div class="grid report-filters"><label>De<input id="reportStart" type="date" required></label><label>Até<input id="reportEnd" type="date" required></label><label>Relatório<select id="reportType"><option value="ENTRADA">Entradas</option><option value="SAIDA">Saídas</option><option value="SALDO">Saldo</option></select></label><label>Depósito<select id="warehouse"></select></label></div><div id="reportStatus" class="operation-feedback" role="status" aria-live="polite" hidden></div><button type="submit">Gerar relatório</button></form><section id="reportResult" class="report-result" aria-live="polite" hidden><div class="section-heading"><div><h2 id="reportTitle">Resultado</h2><p id="reportMeta" class="hint"></p></div><div class="actions report-actions"><button id="reportCSV" class="secondary" type="button">Exportar CSV</button><button id="reportPrint" class="secondary" type="button">Imprimir</button></div></div><div class="report-table-wrap"><table class="report-table"><thead id="reportHead"></thead><tbody id="reportBody"></tbody></table></div></section></section></main><script src="/static/app.js" defer></script></body></html>
