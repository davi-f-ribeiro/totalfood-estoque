<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>{{.Title}} · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body>
<header class="top"><div class="brand"><span class="brand-slot" aria-hidden="true"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button><p id="accountStatus" class="msg" aria-live="polite"></p></div></details></header>
<nav class="nav"><a href="/stock">Estoque</a><a href="/inventory">Inventário</a><a href="/entry">Entrada</a><a href="/exit">Saída</a><a href="/transfer">Transferir</a><a href="/catalog">Catálogo</a><a href="/assets">Patrimônio</a>{{if .CanAdmin}}<a href="/admin">Administração</a>{{end}}</nav>
<main class="main"><section class="panel inventory-panel">
<div class="section-heading"><div><h1>Contagem de inventário</h1><p class="hint">Informe somente a quantidade física encontrada.</p></div><span id="inventoryMode" class="badge" hidden></span></div>
<form id="inventoryOpenForm" class="inventory-open"><label>Número do inventário<input id="inventoryId" inputmode="numeric" pattern="[0-9]*" required></label><button type="submit">Abrir inventário</button></form>
<div id="inventoryWorkspace" hidden>
<div class="inventory-progress"><strong id="inventoryProgress">0 de 0 itens contados</strong><progress id="inventoryProgressBar" max="100" value="0"></progress><small id="inventoryStatusText"></small></div>
<div class="product-scan inventory-tools"><label>Buscar item<input id="inventorySearch" autocomplete="off" placeholder="Descrição, SKU ou código de barras"></label><button id="scanInventory" class="secondary scan-action" type="button"><span class="scan-icon" aria-hidden="true"></span><span>Ler código</span></button></div>
<section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg" aria-live="polite"></p><button id="scanCancel" class="secondary" type="button">Fechar câmera</button></section>
<div class="inventory-filter actions" role="group" aria-label="Filtrar itens"><button type="button" class="secondary selected" data-inventory-filter="pending">Pendentes</button><button type="button" class="secondary" data-inventory-filter="counted">Contados</button><button type="button" class="secondary" data-inventory-filter="all">Todos</button></div>
<p id="inventoryMessage" class="msg" aria-live="polite"></p><div id="inventoryLines" class="inventory-lines"></div>
</div></section></main>
<script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script></body></html>
