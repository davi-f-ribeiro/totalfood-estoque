<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>{{.Title}} · Estoque</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/movement.css"></head><body>{{template "header" .}}{{template "nav" .}}<main class="main movement-main"><section class="panel movement" data-title="{{.Title}}"><h1>{{.Title}}</h1><form id="movementForm" class="movement-form" data-step="1"><ol class="movement-progress" aria-label="Etapas da operação"><li data-progress="1" class="is-current">1 · Produto</li><li data-progress="2">2 · Operação</li><li data-progress="3">3 · Confirmar</li></ol><section class="movement-step movement-step-product is-current" data-step-section="1" aria-labelledby="stepProductTitle"><h2 id="stepProductTitle">Produto</h2><div class="product-scan"><label>Produto<input id="productSearch" autocomplete="off" placeholder="Nome, marca ou código" required></label><button id="scanProduct" class="secondary scan-action" type="button" aria-label="Ler código de barras" title="Ler código"><span class="scan-icon" aria-hidden="true"></span><span>Ler código de barras</span></button></div><div id="productFeedback" class="product-feedback" aria-live="polite"></div><section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg" aria-live="polite"></p><button id="scanCancel" class="secondary" type="button">Fechar câmera</button></section><div id="lookup" class="lookup"></div><input type="hidden" id="skuId"></section><section class="movement-step movement-step-operation" data-step-section="2" aria-labelledby="stepOperationTitle"><h2 id="stepOperationTitle">Operação</h2><div class="grid"><label id="originWrap">Origem<select id="warehouse"></select></label><label id="destWrap">Destino<select id="warehouseTo"></select></label></div><label class="movement-quantity">Quantidade<div class="quantity-field"><input id="quantity" inputmode="decimal" required><small id="unitHint" class="hint" aria-live="polite"></small></div></label><label id="costWrap">Preço por apresentação<input id="unitCost" inputmode="decimal"></label><details class="movement-details"><summary>Mais detalhes</summary><div><label>Documento/referência<input id="documentNumber"></label><label>Observação<textarea id="notes" rows="2"></textarea></label></div></details></section><section class="movement-step movement-step-review" data-step-section="3" aria-labelledby="stepReviewTitle"><h2 id="stepReviewTitle">Confirmar</h2><div id="summary" class="summary" aria-live="polite"></div><section id="movementPending" class="impact-warning" aria-live="polite" hidden><strong>Operação pendente</strong><p id="movementPendingSummary">Verifique a operação anterior antes de registrar outra.</p><div class="actions"><button id="movementCheckPending" class="secondary" type="button">Verificar resultado</button><button id="movementRetryPending" type="button" aria-label="Reenviar a mesma operação" hidden>Reenviar operação</button></div></section></section><div class="movement-actions"><div id="status" class="operation-feedback" role="status" aria-live="polite" hidden></div><button type="button" class="secondary step-prev" data-step-prev>Voltar</button><button type="button" class="step-next" data-step-next>Continuar</button><button type="submit" class="step-submit">Confirmar {{.Title}}</button><button id="movementAnother" class="secondary" type="button" hidden>Registrar outro</button></div></form></section></main><script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script></body></html>
