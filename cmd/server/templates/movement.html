<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>{{.Title}} · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><div class="brand"><span class="brand-slot" aria-label="Logotipo oficial Total Food pendente"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button><p id="accountStatus" class="msg" aria-live="polite"></p></div></details></header><nav class="nav"><a href="/stock">Estoque</a><a href="/entry">Entrada</a><a href="/exit">Saída</a><a href="/transfer">Transferir</a><a href="/catalog">Catálogo</a><a href="/assets">Patrimônio</a>{{if .CanInventory}}<a href="/inventory">Auditoria de Estoque</a>{{end}}{{if .CanAdmin}}<a href="/admin">Administração</a>{{end}}</nav><main class="main"><section class="panel movement" data-title="{{.Title}}"><h1>{{.Title}}</h1><form id="movementForm"><div class="product-scan"><label>Produto<input id="productSearch" autocomplete="off" placeholder="Nome, marca ou código" required></label><button id="scanProduct" class="secondary scan-action" type="button" aria-label="Ler código de barras" title="Ler código"><span class="scan-icon" aria-hidden="true"></span><span>Ler código de barras</span></button></div><div id="productFeedback" class="product-feedback" aria-live="polite"></div><section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg" aria-live="polite"></p><button id="scanCancel" class="secondary" type="button">Fechar câmera</button></section><div id="lookup" class="lookup"></div><input type="hidden" id="skuId"><p id="unitHint" class="hint"></p><div class="grid"><label id="originWrap">Origem<select id="warehouse"></select></label><label id="destWrap">Destino<select id="warehouseTo"></select></label></div><label>Quantidade<input id="quantity" inputmode="decimal" required></label><label id="costWrap">Custo unitário<input id="unitCost" inputmode="decimal"></label><label>Documento/referência<input id="documentNumber"></label><label>Observação<textarea id="notes" rows="2"></textarea></label><div id="summary" class="summary" aria-live="polite"></div><div id="status" class="operation-feedback" role="status" aria-live="polite" hidden></div><button type="submit">Confirmar {{.Title}}</button></form></section></main><script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script></body></html>
