<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="login-shell"><section class="login"><div class="login-brand"><span class="brand-logo large" aria-hidden="true"></span><p class="eyebrow">Gestão de Estoque</p><h1>Entrar no sistema</h1></div>{{if .Error}}<p class="operation-feedback error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/login"><label>Usuário<input name="login" autocomplete="username" required autofocus></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><p class="slogan">Qualidade todo dia!</p></section></main></body></html>
