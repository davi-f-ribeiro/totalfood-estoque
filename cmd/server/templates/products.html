<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Produto/Item · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><div class="brand"><span class="brand-slot"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button></div></details></header>{{template "nav" .}}<main class="main"><section class="panel"><div class="catalog-title"><div><h1>Produto/Item</h1><p class="hint">Cadastre o Produto/Item usando item pai e marca já existentes. A identificação específica do produto é mantida separadamente.</p></div><button id="productNew" type="button">+ Novo Produto/Item</button></div><label>Buscar<input id="productSearch" autocomplete="off" placeholder="Produto, marca ou código de barras"></label><div id="productList" class="catalog-parent-list"></div><form id="productForm" hidden><input id="productId" type="hidden"><div class="grid"><div><label>Item pai<input id="productParentSearch" autocomplete="off" placeholder="Digite para buscar o item pai" required></label><input id="productParent" type="hidden"><div id="productParentLookup" class="lookup" hidden></div></div><label>Marca<select id="productBrand" required></select></label><label>Produto/Item<input id="productName" autocomplete="off" required><small>Identificação específica do produto, por exemplo Original, Branco ou Oreo.</small></label><label>Conteúdo da apresentação<input id="productContent" inputmode="decimal" value="1" required><small>Quantidade na unidade do item pai contida em uma apresentação.</small></label></div><p id="productPreview" class="context-note"></p><div class="product-scan"><label>Código de barras<input id="productBarcode" autocomplete="off" inputmode="numeric" required></label><button id="productScan" class="secondary scan-action" type="button"><span class="scan-icon" aria-hidden="true"></span><span>Ler código</span></button></div><section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg"></p><button id="scanCancel" class="secondary" type="button">Fechar</button></section><label class="check"><input id="productActive" type="checkbox" checked> Produto/Item ativo</label><div class="actions"><button type="submit">Salvar Produto/Item</button><button id="productCancel" class="secondary" type="button">Cancelar</button></div></form><p id="productStatus" class="operation-feedback" role="status" aria-live="polite" hidden></p></section></main><script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script><script src="/static/products.js" defer></script></body></html>
