<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Produtos · Gestão de Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body>{{template "header" .}}{{template "nav" .}}<main class="main"><section class="panel"><div class="catalog-title"><div><h1>Produtos</h1><p class="hint">“Item” é o nome geral, como Leite. “Produto” é esse item numa marca e embalagem, com código de barras. Cadastre aqui cada produto.</p></div><button id="productNew" type="button">+ Novo produto</button></div><label>Buscar<input id="productSearch" autocomplete="off" placeholder="Produto, marca ou código de barras"></label><div id="productList" class="catalog-parent-list"></div><dialog id="productDialog" class="editor-dialog" aria-labelledby="productDialogTitle"><div class="editor-dialog-head"><h2 id="productDialogTitle">Produto</h2></div><form id="productForm" hidden><input id="productId" type="hidden"><div class="grid"><div><label>Item<input id="productParentSearch" autocomplete="off" placeholder="Digite para buscar o item" required></label><input id="productParent" type="hidden"><div id="productParentLookup" class="lookup" hidden></div></div><div><label>Marca<input id="productBrandSearch" autocomplete="off" placeholder="Digite para buscar a marca" required></label><input id="productBrand" type="hidden"><div id="productBrandLookup" class="lookup" hidden></div></div><label>Produto<input id="productName" autocomplete="off" required><small>Como o produto é conhecido, por exemplo Original, Branco ou Integral.</small></label><label>Quanto vem em cada embalagem<input id="productContent" inputmode="decimal" value="1" required><small>Na unidade do item. Por exemplo: 12, se a caixa traz 12 unidades.</small></label></div><p id="productPreview" class="context-note"></p><div class="product-scan"><label>Código de barras<input id="productBarcode" autocomplete="off" inputmode="numeric" required></label><button id="productScan" class="secondary scan-action" type="button"><span class="scan-icon" aria-hidden="true"></span><span>Ler código</span></button></div><section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg"></p><button id="scanCancel" class="secondary" type="button">Fechar</button></section><label class="check"><input id="productActive" type="checkbox" checked> Produto ativo</label><div class="actions"><button type="submit">Salvar produto</button><button id="productCancel" class="secondary" type="button">Cancelar</button></div></form></dialog><p id="productStatus" class="operation-feedback" role="status" aria-live="polite" hidden></p></section></main><script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script><script src="/static/products.js" defer></script></body></html>
