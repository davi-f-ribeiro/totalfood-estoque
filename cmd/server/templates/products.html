<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Produto/Item · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body>{{template "header" .}}{{template "nav" .}}<main class="main"><section class="panel"><div class="catalog-title"><div><h1>Produto/Item</h1><p class="hint">Item pai é o produto genérico; Produto/Item é a marca e embalagem com código de barras. Cadastre aqui a identificação específica do produto.</p></div><button id="productNew" type="button">+ Novo Produto/Item</button></div><label>Buscar<input id="productSearch" autocomplete="off" placeholder="Produto, marca ou código de barras"></label><div id="productList" class="catalog-parent-list"></div><dialog id="productDialog" class="editor-dialog" aria-labelledby="productDialogTitle"><div class="editor-dialog-head"><h2 id="productDialogTitle">Produto/Item</h2></div><form id="productForm" hidden><input id="productId" type="hidden"><div class="grid"><div><label>Item pai<input id="productParentSearch" autocomplete="off" placeholder="Digite para buscar o item pai" required></label><input id="productParent" type="hidden"><div id="productParentLookup" class="lookup" hidden></div></div><div><label>Marca<input id="productBrandSearch" autocomplete="off" placeholder="Digite para buscar a marca" required></label><input id="productBrand" type="hidden"><div id="productBrandLookup" class="lookup" hidden></div></div><label>Produto/Item<input id="productName" autocomplete="off" required><small>Identificação específica do produto, por exemplo Original, Branco ou Oreo.</small></label><label>Conteúdo da apresentação<input id="productContent" inputmode="decimal" value="1" required><small>Quantidade na unidade do item pai contida em uma apresentação.</small></label></div><p id="productPreview" class="context-note"></p><div class="product-scan"><label>Código de barras<input id="productBarcode" autocomplete="off" inputmode="numeric" required></label><button id="productScan" class="secondary scan-action" type="button"><span class="scan-icon" aria-hidden="true"></span><span>Ler código</span></button></div><section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg"></p><button id="scanCancel" class="secondary" type="button">Fechar</button></section><label class="check"><input id="productActive" type="checkbox" checked> Produto/Item ativo</label><div class="actions"><button type="submit">Salvar Produto/Item</button><button id="productCancel" class="secondary" type="button">Cancelar</button></div></form></dialog><p id="productStatus" class="operation-feedback" role="status" aria-live="polite" hidden></p></section></main><script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script><script src="/static/products.js" defer></script></body></html>
