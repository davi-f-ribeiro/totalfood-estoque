<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Patrimônio · Estoque</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><div class="brand"><span class="brand-slot" aria-label="Logotipo oficial Total Food pendente"></span><span class="brand-copy"><strong>Gestão de Estoque</strong><small>Qualidade todo dia!</small></span></div><details class="account"><summary>{{.User.Login}}</summary><div><button id="changePasswordOpen" class="linkish" type="button">Alterar senha</button><button id="logout" class="linkish" type="button">Sair</button><p id="accountStatus" class="msg" aria-live="polite"></p></div></details></header><nav class="nav"><a href="/stock">Estoque</a><a href="/entry">Entrada</a><a href="/exit">Saída</a><a href="/transfer">Transferir</a><a href="/catalog">Catálogo</a><a href="/assets">Patrimônio</a>{{if .CanAdmin}}<a href="/admin">Administração</a>{{end}}</nav><main class="main assets"><section class="panel"><h1>Patrimônio</h1><form id="assetLookupForm"><label>Plaqueta/tag<input id="assetTagLookup" autocomplete="off" placeholder="PAT-001" required></label><button id="scanAsset" class="secondary" type="button" hidden>Ler plaqueta</button><section id="scanner" class="scanner" hidden><video id="scannerVideo" playsinline muted></video><p id="scanStatus" class="msg" aria-live="polite"></p><button id="scanCancel" class="secondary" type="button">Cancelar leitura</button></section><button type="submit">Localizar</button><p id="assetLookupStatus" class="msg" aria-live="polite"></p></form><div id="assetCurrent" class="summary" hidden></div><div id="assetOps" hidden><div class="grid"><form id="assetMoveForm"><label>Nova localização<select id="assetMoveWarehouse"></select></label><button type="submit">Mover</button></form><form id="assetStatusForm"><label>Novo estado<select id="assetNewStatus"><option value="ATIVO">Ativo</option><option value="EM_MANUTENCAO">Em manutenção</option><option value="BAIXADO">Baixado</option></select></label><button type="submit">Alterar estado</button></form></div><p id="assetOpStatus" class="msg" aria-live="polite"></p></div></section><section class="panel"><h1>Tipos patrimoniais</h1><form id="assetTypeForm"><input type="hidden" id="assetTypeId"><label>Tipo/modelo<input id="assetTypeName" autocomplete="off" required></label><label class="check"><input id="assetTypeActive" type="checkbox" checked> Ativo</label><button type="submit">Salvar tipo</button><p id="assetTypeStatus" class="msg" aria-live="polite"></p></form><div id="assetTypesList" class="list"></div></section><section class="panel"><h1>Unidades patrimoniais</h1><form id="assetUnitForm"><input type="hidden" id="assetUnitId"><div class="grid"><label>Tipo<select id="assetUnitType" required></select></label><label>Plaqueta/tag<input id="assetUnitTag" autocomplete="off" required></label></div><div class="grid"><label>Estado<select id="assetUnitStatus"><option value="ATIVO">Ativo</option><option value="EM_MANUTENCAO">Em manutenção</option><option value="BAIXADO">Baixado</option></select></label><label>Localização<select id="assetUnitWarehouse"></select></label></div><button type="submit">Salvar unidade</button><p id="assetUnitStatusMsg" class="msg" aria-live="polite"></p></form><div id="assetsList" class="list"></div></section></main><script src="/static/app.js" defer></script></body></html>
