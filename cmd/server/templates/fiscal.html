<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{.CSRF}}"><title>Importar nota fiscal · Estoque</title><link rel="stylesheet" href="/static/app.css"></head>
<body>{{template "header" .}}{{template "nav" .}}
<main class="main fiscal-shell"><section class="panel fiscal"><h1>Importar nota fiscal</h1><p class="hint">Leia o QR code da nota ou cole o endereço dela. Consultar não muda o estoque.</p>
<form id="fiscalForm"><label>QR code ou endereço da nota<textarea id="fiscalQR" rows="4" required></textarea></label><button id="scanFiscal" class="secondary" type="button" hidden>Ler QR code</button><section id="scanner" class="scanner" hidden><video id="scanner-video" autoplay muted playsinline webkit-playsinline></video><p id="scanStatus" class="msg" aria-live="polite"></p><button id="scanCancel" class="secondary" type="button">Cancelar leitura</button></section><button type="submit">Consultar</button><p id="fiscalStatus" class="operation-feedback" role="status" aria-live="polite" hidden></p><div id="fiscalResult" class="summary" aria-live="polite"></div></form>
<section id="manualFiscal" hidden><h2>Digitar os itens</h2><p class="hint">Use quando a nota foi encontrada, mas os itens não vieram na consulta.</p><form id="fiscalManualForm"><label>Depósito<select id="fiscalWarehouse" required></select></label><input id="fiscalAccessKey" type="hidden"><div id="fiscalLines"></div><button id="addFiscalLine" class="secondary" type="button">Adicionar item</button><button type="submit">Confirmar entrada</button><p id="fiscalConfirmStatus" class="operation-feedback" role="status" aria-live="polite" hidden></p></form></section>
</section></main><script src="/static/vendor/zxing-browser.min.js" defer></script><script src="/static/app.js" defer></script></body></html>
