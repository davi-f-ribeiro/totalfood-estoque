name: production-gate
on:
  push:
    branches:
      - main
      - 'hotfix/**'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: estoque_test
          POSTGRES_USER: estoque
          POSTGRES_PASSWORD: estoque_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque -d estoque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://estoque:estoque_test@127.0.0.1:5432/estoque_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: JavaScript syntax
        run: node --check cmd/server/static/app.js
      - name: Go tests with PostgreSQL 17
        run: go test -count=1 ./...
      - name: Go build
        run: go build ./...
      - name: Docker build
        run: docker build -t totalfood-estoque:validation .
