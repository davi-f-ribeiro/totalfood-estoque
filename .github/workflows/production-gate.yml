name: production-gate

on:
  push:
    branches:
      - main
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://estoque:estoque_test@127.0.0.1:5432/estoque_test?sslmode=disable
    steps:
      - name: Prepare self-hosted Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          sudo systemctl start docker || true
          docker --version
      - name: Start PostgreSQL 17
        run: |
          docker rm -f totalfood-pg-ci >/dev/null 2>&1 || true
          docker run -d --name totalfood-pg-ci \
            -e POSTGRES_DB=estoque_test \
            -e POSTGRES_USER=estoque \
            -e POSTGRES_PASSWORD=estoque_test \
            -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec totalfood-pg-ci pg_isready -U estoque -d estoque_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs totalfood-pg-ci
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Toolchain versions
        run: |
          go version
          node --version
          psql --version
          docker --version
      - name: JavaScript syntax
        run: node --check cmd/server/static/app.js
      - name: Go vet
        run: go vet ./...
      - name: Go tests with PostgreSQL 17
        run: go test -count=1 ./...
      - name: Go race tests with PostgreSQL 17
        run: go test -race -count=1 ./...
      - name: Go build
        run: go build ./...
      - name: Docker build
        run: docker build -t totalfood-estoque:production-gate .
      - name: Stop PostgreSQL 17
        if: always()
        run: docker rm -f totalfood-pg-ci >/dev/null 2>&1 || true
