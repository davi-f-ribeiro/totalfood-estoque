name: production-gate

on:
  push:
    branches:
      - main
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: estoque_test
          POSTGRES_USER: estoque
          POSTGRES_PASSWORD: estoque_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque -d estoque_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://estoque:estoque_test@127.0.0.1:5432/estoque_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain versions
        run: |
          missing=0
          for tool in go node psql docker; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
              "$tool" --version 2>&1 | head -1 || true
            else
              echo "::error::$tool não encontrado no executor (PATH=$PATH)"
              missing=1
            fi
          done
          exit $missing
      - name: JavaScript syntax
        run: node --check cmd/server/static/app.js && node --check cmd/server/static/batch.js
      - name: Go vet
        run: go vet ./...
      - name: Go tests with PostgreSQL 17
        run: go test -count=1 ./...
      - name: Go race tests with PostgreSQL 17
        run: go test -race -count=1 ./...
      - name: Go build
        run: go build ./...
      - name: Docker build
        run: docker build -t totalfood-estoque:production-gate .
