name: firmware-ci

on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'firmware/etiqueta_zd220/**'
      - '.github/workflows/firmware-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install pinned ESP32 core and firmware libraries
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.0.5 --additional-urls "$URL"
          arduino-cli lib install WiFiManager
          arduino-cli lib install PubSubClient
          arduino-cli core list
          arduino-cli lib list
      - name: Compile ESP32-S3 N16R8 (USB host + OTA)
        run: |
          set -euo pipefail
          BOARDS="$HOME/.arduino15/packages/esp32/hardware/esp32/3.0.5/boards.txt"
          test -r "$BOARDS"
          echo "16 MB partition schemes available in core 3.0.5:"
          grep -E '^esp32s3[.]menu[.]PartitionScheme[.][^.]+=' "$BOARDS" | grep '16M' || true
          # Select a 16 MB layout with 3 MB OTA app slots, not a huge/no-OTA layout.
          PARTITION=$(awk -F= '/^esp32s3[.]menu[.]PartitionScheme[.][^.]+=/ && /16M/ && /3MB APP/ {
            split($1, parts, "."); print parts[4]; exit
          }' "$BOARDS")
          if [ -z "$PARTITION" ]; then
            echo "::error::No ESP32-S3 16MB / 3MB OTA partition scheme found in esp32 core 3.0.5"
            exit 1
          fi
          FQBN="esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=$PARTITION,PSRAM=opi,USBMode=hwcdc"
          echo "Compiling with FQBN $FQBN"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir "$RUNNER_TEMP/totalfood-esp32-build" \
            firmware/etiqueta_zd220
      - name: Name binaries with the firmware version
        id: version
        run: |
          set -euo pipefail
          # Versão vem de FW_VERSION no .ino, a mesma exibida pelo ESP.
          V=$(sed -n 's/^#define FW_VERSION *"\([0-9][0-9.]*\)".*/\1/p' firmware/etiqueta_zd220/etiqueta_zd220.ino)
          if [ -z "$V" ]; then
            echo "::error::FW_VERSION not found in etiqueta_zd220.ino"
            exit 1
          fi
          cd "$RUNNER_TEMP/totalfood-esp32-build"
          for f in etiqueta_zd220.ino*.bin; do
            mv "$f" "${f/etiqueta_zd220.ino/etiqueta_zd220-v$V}"
          done
          ls -l *.bin
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Upload firmware build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: totalfood-esp32-s3-n16r8-v${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/totalfood-esp32-build/*.bin
          if-no-files-found: error
          retention-days: 7
