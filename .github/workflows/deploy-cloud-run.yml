name: Deploy Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: estoque
  MIGRATIONS_DIR: /app/migrations
  RUN_MIGRATIONS: "false"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./cmd/server

      - name: Build
        run: go build ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GAR_LOCATION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${IMAGE_NAME}:${{ github.sha }}"
          docker build --tag "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --project=${{ vars.GCP_PROJECT_ID }}
            --platform=managed
            --allow-unauthenticated
            --cpu=1
            --memory=512Mi
            --concurrency=20
            --min-instances=0
            --max-instances=2
            --timeout=30s
            --set-env-vars=MIGRATIONS_DIR=${{ env.MIGRATIONS_DIR }},RUN_MIGRATIONS=${{ env.RUN_MIGRATIONS }},COOKIE_SECURE=true
            --set-secrets=DATABASE_URL=${{ vars.DATABASE_SECRET_NAME }}:latest

      - name: Health check
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "CLOUD_RUN_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --show-error --silent --location --max-time 20 "$URL/health"
