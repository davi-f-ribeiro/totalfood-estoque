name: movement-ui-ci

on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'cmd/server/static/app.js'
      - 'cmd/server/static/utils/offline-store.js'
      - 'cmd/server/static/batch.js'
      - 'cmd/server/static/batch.css'
      - 'cmd/server/static/movement.css'
      - 'cmd/server/static/app.css'
      - 'cmd/server/templates/movement.html'
      - 'scripts/exit-batch-mobile-playwright-e2e.cjs'
      - '.github/workflows/movement-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/movement-playwright" --no-audit --no-fund --save=false playwright@1.56.1
      - name: Test Saída em lote at 390 pixels (and desktop)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$CHROME_BIN"
          NODE_PATH="$RUNNER_TEMP/movement-playwright/node_modules" CHROME_BIN="$CHROME_BIN" node scripts/exit-batch-mobile-playwright-e2e.cjs
